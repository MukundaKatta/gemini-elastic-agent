[project]
name = "gemini-elastic-agent"
version = "0.1.0"
description = "Gemini 2.5 Flash ADK agent that runs hybrid (vector + lexical) search on an Elastic cluster."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mukunda Katta" }]
requires-python = ">=3.10"
dependencies = [
    "google-adk>=2.0.0",
    "elasticsearch>=8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.urls]
Homepage = "https://github.com/MukundaKatta/gemini-elastic-agent"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

